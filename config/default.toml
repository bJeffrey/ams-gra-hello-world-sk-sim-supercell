# SuperCell — Default scenario (1 ownship + 2 bandits)
#
# Blue ownship (Eagle-1) and red bandit (Bandit-1) fly a pentagon pattern
# centered on (36.0143, -75.6676), with Bandit-1 one leg
# ahead of Eagle-1 and 300 ft lower.
# Suitable for integration testing with worldview and graupel.

tick_hz = 5.0
waypoint_threshold_m = 500.0

# Geoid undulation approximation for this scenario area.
geoid_undulation_m = -39.0

admin_bind_addr = "0.0.0.0:21300"

[dis]
multicast_addr = "239.1.2.3"
port           = 21100
exercise_id    = 1
multicast_iface = "127.0.0.1"

[oms.la-cal]
ws_url = "ws://127.0.0.1:21402/owp"
service_id = "supercell"
# system_uuid    = "00000000-0000-1000-8000-000000000001"
position_hz = 1.0
prd_hz = 0.5

# ── RED BANDIT ────────────────────────────────────────────────────────────────
